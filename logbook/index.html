<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LogBook · Santoro's Logging</title>
  <meta name="description" content="Santoro's Logging crew time tracking">
  <meta name="theme-color" content="#1d4a2a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LogBook">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Apply the saved light/dark choice before the page draws (no white flash).
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('logbook-ui-theme') || 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="boot"><img src="assets/logo-s.png" alt="Santoro's Logging"><p>Loading LogBook…</p></div>
  </div>
  <div id="modal"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
